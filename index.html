<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 针对移动端优化：禁止缩放，适配刘海屏，使其更像原生App -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>新托业词汇本领书</title>
  
  <!-- PWA 沉浸式应用相关 Meta 标签 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:book-open.svg?color=%234f46e5">

  <!-- 引入 Tailwind CSS 样式库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 React 相关库 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    /* 隐藏移动端点击高亮 */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    /* 美化滚动条 */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent; 
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 font-sans select-none pb-safe">
  
  <div id="root"></div>

  <!-- React 逻辑核心 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialVocabData = [
      {
        chapter: "Chapter 1: 商务谈判 (Business Negotiations)",
        words: [
          { en: "appointment", zh: "n. 约会；约定", example: "If you would like to meet with Mr. Higgins, you must first make an appointment with his secretary." },
          { en: "attendance", zh: "n. 出席；出席人数", example: "I was very pleased with the number of high-ranking officials in attendance at today's press conference." },
          { en: "cabinet", zh: "n. 橱柜", example: "He keeps all his files in the cabinets in the back of the office." },
          { en: "calendar", zh: "n. 日历；月历；行事历", example: "Please check the calendar on the wall and see which date Mother's Day falls on this year." },
          { en: "clerk", zh: "n. 办事员，书记", example: "She was offered a job as an accounts clerk with a travel firm." },
          { en: "directory", zh: "n. 人名住址簿", example: "If you need to speak to him, you can use the office directory and look up his personal extension." },
          { en: "duplicate", zh: "(1) n. 副本 (2) vt. 复制", example: "Please don't bring a duplicate, since I will need to see your original birth certificate for this passport." },
          { en: "filing", zh: "n. 归档", example: "Developed in the early 1900's, the Dewey Decimal System is a filing system still used by libraries today." },
          { en: "in-tray", zh: "n. 待处理文件盒", example: "The more Dennis procrastinated, the more the stack of paperwork in his in-tray resembled the Rocky Mountains." },
          { en: "monitor", zh: "vt. 检测；监视；追踪", example: "Seismic readouts are carefully monitored by seismologists, who are always on the lookout for the next big earthquake." },
          { en: "out-tray", zh: "n. 已处理文件盒", example: "I will leave that file in my out-tray on my desk, and you can come pick it up anytime in the afternoon." },
          { en: "partition", zh: "n. 分隔；分隔物(如墙壁等)", example: "We don't have the money to add an entirely new office, but what we can do is add a partition and divide one or two of the larger offices into multiple smaller ones." },
          { en: "postage", zh: "n. 邮费", example: "How much postage is required for a small package to be sent to HongKong?" },
          { en: "punctuality", zh: "n. 准时，守时", example: "In addition to your dress and appearance, punctuality and a concise delivery are really important when you are giving such an important presentation." },
          { en: "schedule", zh: "n. 时间表；计划表", example: "The plane arrived in Cairo four minutes ahead of schedule." },
          { en: "shift", zh: "n. 换班；轮班；值班", example: "They often heard him complain about having to work the graveyard shift in order to pay the bills." },
          { en: "staff", zh: "n. 全体职工", example: "The staff at the five-star Formosa Hotel delivers prompt and friendly service." },
          { en: "strike", zh: "n. 罢工", example: "I'm glad that our employees were satisfied and didn't find the need for a strike to express their concerns." },
          { en: "task", zh: "n. 任务", example: "This task must be made top priority because a very important client wants to pick up these papers today." },
          { en: "work force", zh: "n. 工作人员，劳动人口", example: "After months of unemployment, Tim joined the American work force as the night manager at KFC." }
        ]
      },
      {
        chapter: "Chapter 2: 办公室日常 (Office Daily Life)",
        words: [
          { en: "assignment", zh: "n. 工作；分配；分派", example: "Since he has been covering the same story for two weeks, I think he would really be excited about a new assignment." },
          { en: "bulletin", zh: "n. 公报，告示；定期报告(书)", example: "We sent out a bulletin to all of the executives, informing them of the changes discussed at today's meeting." },
          { en: "calculator", zh: "n. 计算器", example: "I made so many mistakes in my checkbook; I had to get out my calculator to add the figures up again." },
          { en: "carbon copy", zh: "n. 用复写纸复制的副本", example: "You will need to keep the carbon copy of that receipt for your record and give me the original." },
          { en: "colleague", zh: "n. 同事；同僚", example: "Because my doctor can't help me with my problems, he is going to refer me to a colleague of his at another hospital." },
          { en: "document", zh: "n. 文件；证件", example: "The Declaration of Independence is a document with tremendous historical significance." },
          { en: "extension", zh: "n. 分机；延期", example: "For further information, please contact 2344-3849, extension 104." },
          { en: "intercom", zh: "n. 对讲机", example: "Would you please page Mr. William over the intercom and tell him to meet me at the front desk?" },
          { en: "memo", zh: "n. 便条；便笺；备忘录", example: "Everyone's curiosity was piqued upon circulation of a memo announcing the senior vice-president's resignation." },
          { en: "operator", zh: "n. 接线生", example: "If you know the extension of the party you wish to reach, dial it now or wait on the line for operator assistance." },
          { en: "overtime", zh: "n. 加班的时间", example: "Federal regulations require businesses to pay extra money to employees for their overtime." },
          { en: "portfolio", zh: "n. 作品(夹)；公事包", example: "The architect will want to look at your portfolio before he considers you for the job of designing the new building." },
          { en: "printed matter", zh: "n. 印刷品", example: "Please check all the letters with printed matter on them as we can get a better rate for them at the post office." },
          { en: "receptionist", zh: "n. 接待员", example: "Before entering the boardroom, Mr. Withers told the receptionist to hold all of his calls until after the meeting." },
          { en: "secretary", zh: "n. 秘书", example: "The manager was mad at his secretary because she failed to remind him of an important appointment." },
          { en: "shorthand", zh: "n. 速记法", example: "Because his secretary was so adept at shorthand, he felt comfortable dictating to her at his own pace." },
          { en: "stapler", zh: "n. 订书机", example: "The stapler gets jammed every time I want to use it." },
          { en: "tardy", zh: "adj. 迟到的；迟延的", example: "We apologize for the tardy response to your letter." },
          { en: "typist", zh: "n. 打字员", example: "Don't forget to remind the typist to delete the last three sentences." },
          { en: "xerox", zh: "vi. 影印，复印", example: "You don't need to copy the entire book by hand; just xerox it and mail it to the publisher." }
        ]
      }
    ];

    const BookIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" /></svg>
    );

    const MenuIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
    );

    const PlusIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
    );

    const TrashIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    );

    const CustomDialog = ({ isOpen, type, message, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden text-center transform transition-all">
            <div className="p-6">
              <div className={`mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 ${type === 'alert' ? 'bg-red-100 text-red-500' : 'bg-indigo-100 text-indigo-500'}`}>
                {type === 'alert' ? (
                  <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                ) : (
                  <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                )}
              </div>
              <p className="text-base text-gray-800 font-medium mb-6">{message}</p>
              <div className="flex justify-center gap-3">
                {type === 'confirm' && (
                  <button onClick={onCancel} className="flex-1 px-4 py-2.5 text-sm font-bold text-gray-600 bg-gray-100 rounded-xl hover:bg-gray-200 active:scale-95 transition-all">
                    取消
                  </button>
                )}
                <button onClick={onConfirm} className="flex-1 px-4 py-2.5 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 active:scale-95 transition-all">
                  确定
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const WordCard = ({ word, onDelete }) => {
      const [isExpanded, setIsExpanded] = useState(false);

      return (
        <div 
          onClick={() => setIsExpanded(!isExpanded)}
          className={`relative overflow-hidden cursor-pointer rounded-2xl shadow-sm border border-gray-200 bg-white transition-all duration-300 ease-out active:scale-[0.98] ${isExpanded ? 'shadow-md border-indigo-200' : ''}`}
        >
          <div className="p-6 md:p-8 flex flex-col h-full min-h-[160px] justify-center items-center text-center">
            
            {isExpanded && (
              <button 
                onClick={(e) => { e.stopPropagation(); onDelete(); }}
                className="absolute top-3 right-3 text-gray-300 hover:text-red-500 transition-colors p-3 bg-gray-50 rounded-full active:bg-gray-100"
              >
                <TrashIcon />
              </button>
            )}

            <h3 className={`font-bold text-gray-800 transition-all duration-300 ${isExpanded ? 'text-2xl mb-4 text-indigo-700' : 'text-3xl'}`}>
              {word.en}
            </h3>
            
            {!isExpanded && (
              <div className="absolute bottom-4 text-[10px] font-bold text-gray-300 tracking-widest uppercase">
                点击翻转
              </div>
            )}

            {isExpanded && (
              <div className="w-full flex flex-col items-center animate-fadeIn">
                <div className="w-8 h-1 bg-indigo-100 rounded-full mb-3"></div>
                <p className="text-base md:text-lg font-bold text-blue-600 mb-3">{word.zh}</p>
                <div className="bg-slate-50 p-4 rounded-xl w-full">
                  <p className="text-sm text-gray-600 italic leading-relaxed text-left">
                    "{word.example}"
                  </p>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const [vocabList, setVocabList] = useState(() => {
        const saved = localStorage.getItem('toeicVocabList');
        return saved ? JSON.parse(saved) : initialVocabData;
      });

      const [activeChapterIndex, setActiveChapterIndex] = useState(0);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newChapterName, setNewChapterName] = useState("");
      const [newVocabText, setNewVocabText] = useState("");

      const [dialog, setDialog] = useState({ isOpen: false, type: 'alert', message: '', onConfirm: null, onCancel: null });

      useEffect(() => {
        localStorage.setItem('toeicVocabList', JSON.stringify(vocabList));
      }, [vocabList]);

      const activeChapter = vocabList[activeChapterIndex] || { chapter: "无数据", words: [] };

      const showAlert = (message) => {
        setDialog({ isOpen: true, type: 'alert', message, onConfirm: () => setDialog({ isOpen: false }) });
      };

      const showConfirm = (message, confirmCallback) => {
        setDialog({
          isOpen: true,
          type: 'confirm',
          message,
          onConfirm: () => {
            confirmCallback();
            setDialog({ isOpen: false });
          },
          onCancel: () => setDialog({ isOpen: false })
        });
      };

      const handleImport = () => {
        if (!newChapterName.trim()) {
          showAlert("请先输入章节名称！");
          return;
        }
        
        const lines = newVocabText.split('\n');
        const newWords = [];
        
        lines.forEach(line => {
          const parts = line.split('|').map(s => s.trim());
          if (parts.length >= 2 && parts[0] !== "") {
            newWords.push({
              en: parts[0],
              zh: parts[1],
              example: parts[2] || "暂无例句"
            });
          }
        });

        if (newWords.length === 0) {
          showAlert("格式不对哦：单词 | 释义 | 例句");
          return;
        }

        const newChapter = { chapter: newChapterName, words: newWords };
        setVocabList([...vocabList, newChapter]);
        setNewChapterName("");
        setNewVocabText("");
        setIsModalOpen(false);
        setActiveChapterIndex(vocabList.length);
      };

      const handleDeleteWord = (wordIndex) => {
        showConfirm("要永久删除这个单词吗？", () => {
          const updatedList = [...vocabList];
          updatedList[activeChapterIndex].words.splice(wordIndex, 1);
          setVocabList(updatedList);
        });
      };

      const handleDeleteChapter = () => {
        showConfirm(`确认删除整章 "${activeChapter.chapter}" 吗？`, () => {
          const updatedList = vocabList.filter((_, idx) => idx !== activeChapterIndex);
          setVocabList(updatedList.length > 0 ? updatedList : [{ chapter: "默认章节", words: [] }]);
          setActiveChapterIndex(0);
        });
      };

      return (
        <div className="h-[100dvh] flex flex-col md:flex-row overflow-hidden bg-slate-50 pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
          <CustomDialog {...dialog} />

          {/* 移动端顶部导航 (沉浸式) */}
          <div className="md:hidden bg-indigo-600 shadow-md p-4 flex justify-between items-center z-20 text-white">
            <div className="flex items-center font-bold text-lg">
              <BookIcon />
              <span>新托业词汇</span>
            </div>
            <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-1 active:scale-95 transition-transform">
              <MenuIcon />
            </button>
          </div>

          {/* 侧边栏 */}
          <div className={`
            fixed md:relative top-0 left-0 h-full w-[280px] bg-white shadow-2xl md:shadow-none md:border-r border-gray-100 z-50 
            transform transition-transform duration-300 ease-in-out
            ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
            flex flex-col pt-[env(safe-area-inset-top)]
          `}>
            {/* 移动端侧边栏头部 */}
            <div className="p-5 border-b border-gray-100 flex md:hidden justify-between items-center">
              <span className="font-bold text-gray-800">所有章节</span>
              <button onClick={() => setIsSidebarOpen(false)} className="text-gray-400 bg-gray-50 p-2 rounded-full">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>

            <div className="p-6 border-b border-gray-100 hidden md:flex items-center text-xl font-bold text-indigo-700">
              <BookIcon />
              <span>词汇本领书</span>
            </div>
            
            <div className="p-4">
              <button 
                onClick={() => { setIsModalOpen(true); setIsSidebarOpen(false); }}
                className="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center"
              >
                <PlusIcon /> 导入新词库
              </button>
            </div>

            <div className="flex-1 overflow-y-auto py-2 px-2 scroll-smooth">
              <ul className="space-y-1">
                {vocabList.map((chapter, index) => (
                  <li key={index}>
                    <button
                      onClick={() => { setActiveChapterIndex(index); setIsSidebarOpen(false); }}
                      className={`w-full text-left px-4 py-3.5 rounded-xl transition-all duration-200 flex items-center justify-between ${
                        activeChapterIndex === index 
                          ? 'bg-indigo-50 text-indigo-700 font-bold shadow-sm' 
                          : 'text-gray-600 active:bg-gray-100'
                      }`}
                    >
                      <span className="truncate pr-2 text-sm">{chapter.chapter}</span>
                      <span className="text-xs bg-white/60 text-gray-500 px-2 py-1 rounded-lg border border-gray-100">{chapter.words.length}</span>
                    </button>
                  </li>
                ))}
              </ul>
            </div>
          </div>

          {/* 移动端侧边栏遮罩 */}
          {isSidebarOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 md:hidden transition-opacity" onClick={() => setIsSidebarOpen(false)}></div>
          )}

          {/* 右侧主内容区域 */}
          <div className="flex-1 overflow-y-auto p-4 md:p-8 lg:p-12 scroll-smooth">
            <div className="max-w-5xl mx-auto pb-8">
              
              <div className="mb-6 md:mb-12 flex flex-col md:flex-row md:items-end justify-between gap-4 bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div>
                  <h2 className="text-xl md:text-3xl font-black text-gray-800 mb-2 leading-tight">
                    {activeChapter.chapter}
                  </h2>
                  <div className="text-gray-500 text-sm font-medium">
                    共 {activeChapter.words.length} 个单词
                  </div>
                </div>
                
                <button 
                  onClick={handleDeleteChapter}
                  className="text-xs font-bold text-red-500 bg-red-50 hover:bg-red-100 flex items-center justify-center transition-colors px-4 py-2 rounded-xl active:scale-95"
                >
                  <TrashIcon /> <span className="ml-1">清空章节</span>
                </button>
              </div>

              {activeChapter.words.length > 0 ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                  {activeChapter.words.map((word, index) => (
                    <WordCard key={`${activeChapterIndex}-${index}-${word.en}`} word={word} onDelete={() => handleDeleteWord(index)} />
                  ))}
                </div>
              ) : (
                <div className="text-center py-24 bg-white rounded-3xl shadow-sm border border-dashed border-gray-200">
                  <div className="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                    <BookIcon />
                  </div>
                  <p className="text-gray-400 mb-6 font-medium">此章节空空如也</p>
                  <button onClick={() => setIsModalOpen(true)} className="text-white bg-indigo-600 px-6 py-2.5 rounded-full font-bold shadow-md active:scale-95 transition-transform">
                    马上导入单词
                  </button>
                </div>
              )}
              
              {activeChapter.words.length > 0 && (
                <div className="mt-12 text-center text-xs font-bold text-gray-300 flex items-center justify-center gap-3 uppercase tracking-widest">
                  <span className="w-8 h-[2px] bg-gray-200 rounded-full"></span>
                  END
                  <span className="w-8 h-[2px] bg-gray-200 rounded-full"></span>
                </div>
              )}
            </div>
          </div>

          {/* 导入弹窗 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-[60] flex items-end md:items-center justify-center bg-black/50 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white w-full md:w-[600px] rounded-t-3xl md:rounded-3xl shadow-2xl flex flex-col h-[85vh] md:h-auto md:max-h-[85vh]">
                
                <div className="p-5 border-b border-gray-100 flex justify-between items-center">
                  <h3 className="text-lg font-bold text-gray-800 flex items-center">
                    <PlusIcon /> 批量导入新词库
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 bg-gray-100 rounded-full p-1.5 active:bg-gray-200">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                  </button>
                </div>
                
                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2">章节名称</label>
                    <input type="text" value={newChapterName} onChange={(e) => setNewChapterName(e.target.value)} placeholder="例如: Unit 1 高频词" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm font-medium"/>
                  </div>
                  <div className="flex-1 flex flex-col">

                <div className="p-5 border-t border-gray-100 bg-white flex gap-3 pb-[calc(1.25rem+env(safe-area-inset-bottom))]">
                  <button onClick={() => setIsModalOpen(false)} className="flex-1 py-3 text-sm font-bold text-gray-600 bg-gray-100 rounded-xl active:scale-95 transition-transform">取消</button>
                  <button onClick={handleImport} className="flex-[2] py-3 text-sm font-bold text-white bg-indigo-600 rounded-xl shadow-md active:scale-95 transition-transform">保存并生成卡片</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
